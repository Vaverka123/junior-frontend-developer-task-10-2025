<div class="container p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="fw-bold mb-0">{{ title }}</h1>
    <button
      title="Dodaj zadanie"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#addTaskModal"
    >
      + Dodaj zadanie
    </button>
  </div>

  <task-filters
    [filters]="filters"
    (filtersChange)="filters = $event"
  ></task-filters>

  <task-group
    [tasks]="filteredTasks"
    (toggleCompleted)="toggleCompleted($event)"
    (toggleDescription)="toggleDescription($event)"
    (removeTask)="openRemoveModal($event)"
  ></task-group>

  <add-task-modal (addTask)="addTask($event)"></add-task-modal>
  <remove-task-modal
    [taskToRemove]="selectedTaskToRemove"
    (confirmRemove)="removeTask($event)"
  ></remove-task-modal>
</div>
